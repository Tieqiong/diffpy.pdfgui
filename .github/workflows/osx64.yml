name: CI

on:
  push:
  workflow_dispatch:

jobs:
  coverage:
    defaults:
      run:
        shell: bash -l {0}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13]
        python-version: ["3.13"]
    env:
      LATEST_PYTHON_VERSION: "3.13"
    steps:
      - name: Check out diffpy.pdfgui
        uses: actions/checkout@v4
      - name: Initialize miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: test
          miniforge-version: latest
          auto-update-conda: true
          environment-file: environment.yml
          auto-activate-base: false
          python-version: ${{ matrix.python-version }}

      - name: Conda config
        run: >-
          conda config --set always_yes yes
          --set changeps1 no
      - name: Install diffpy.pdfgui and requirements
        run: |
          conda info
          conda install --file requirements/test.txt
          conda install wxpython diffpy.utils matplotlib-base
          pip install diffpy.pdffit2==1.5.0rc1
          python -m pip install . --no-deps
      - name: Start Xvfb for ubuntu-latest only
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y xvfb
          export DISPLAY=:99
          Xvfb :99 -screen 0 1024x768x16 &
      - name: Validate diffpy.pdfgui
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            export DISPLAY=:99
          fi
          pytest --cov
          coverage report -m
          codecov
